name: UFR-U

on:
  schedule:
    - cron: '*/10 * * * *' # Run every 10 minutes
  workflow_dispatch: # Allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository B
        uses: actions/checkout@v2
        with:
          token: ${{ secrets.REPO_B_PAT }}

      - name: Checkout Repository A
        uses: actions/checkout@v2
        with:
          repository: sun532818microbit/Clock-V2
          token: ${{ secrets.REPO_A_PAT }}
          path: repo-a

      - name: Copy index.html from Repository A to Repository B
        run: cp repo-a/index.html ./index.html

      - name: Commit and push changes
        env:
          REPO_B_PAT: ${{ secrets.REPO_B_PAT }}
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add index.html
          git commit -m 'Update from Repository A'
          git push https://$REPO_B_PAT@github.com/thisisclock/thisisclock.github.io.git
